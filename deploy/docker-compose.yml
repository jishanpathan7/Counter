# Production stack: the app (with continuous backups) behind Caddy, which gets and renews the
# HTTPS certificate for your domain automatically. See deploy/README.md.
#
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose up -d --build

services:
  app:
    build:
      context: ..
      args:
        APP_RELEASE: ${APP_RELEASE:-dev}
    image: attendance-alert:${APP_RELEASE:-latest}
    init: true # passes stop signals on, so the last changes are backed up before exit
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TRUST_PROXY: "1" # Caddy is one hop in front: use the visitor's real address for login limits
    volumes:
      - data:/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  data:
  caddy_data:
  caddy_config:
